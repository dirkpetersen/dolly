name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Release binaries are built with the latest stable Go (current
      # crypto/tls, crypto/x509, net/* fixes); go.mod's go 1.22 is only the
      # minimum the code compiles with (checked by ci.yml's go-min job).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
