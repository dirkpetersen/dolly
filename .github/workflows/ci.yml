name: ci

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", ".goreleaser.yaml"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", ".goreleaser.yaml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/dolly

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
